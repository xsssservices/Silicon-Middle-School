  <style>
    body {

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
    }
    .page {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border: 1px solid #ddd;
      padding: 40px 50px;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin: 0 0 10px;
      text-transform: uppercase;
    }
    h2 {
      text-align: center;
      font-size: 18px;
      font-weight: normal;
      margin: 0 0 25px;
    }
    .toc-list {
      margin-top: 20px;
    }
    .toc-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e5e5e5;
      font-size: 16px;
    }
    .toc-item a {
      color: #222;
      text-decoration: none;
    }
    .page-number {
      font-weight: bold;
    }
    .next-btn,
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      background: linear-gradient(135deg, #1f5f3d, #2e8b57);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .next-btn:hover,
    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
      background: linear-gradient(135deg, #2e8b57, #1f5f3d);
    }
    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      gap: 12px;
    }
    .nav-back {
      background: linear-gradient(135deg, #5b6c7d, #6f8294);
    }
    .nav-back:hover {
      background: linear-gradient(135deg, #6f8294, #5b6c7d);
    }
    .page-nav span {
      flex: 1;
    }
  </style>
